name: Code Coverage

on:
  pull_request:
    branches: [ master, dev ]
  push:
    branches: [ master ]
  workflow_dispatch: # Trigger from UI for selected branch
  schedule:
    - cron: "0 0 * * *" # Every day at midnight UTC

env:
  POETRY_VERSION: 2.1.3

jobs:
  unit-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Install minimal stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: actions/checkout@v5
        with:
          # If scheduled by cron, run for dev branch, Otherwise specified branch (for workflow dispatch & push)
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref_name }}
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Install llvm-cov
        run: cargo install cargo-llvm-cov && sudo apt install -y lcov
      - name: Run unit tests with coverage
        run: RUN_PER_PACKAGE=true tools/unit-test-coverage.sh
      - name: Upload unit test coverage artifact
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-coverage
          path: unit-test-coverage.lcov
          retention-days: 1

  integration-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Install minimal stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: actions/checkout@v5
        with:
          # If scheduled by cron, run for dev branch, Otherwise specified branch (for workflow dispatch & push)
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref_name }}
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Install llvm-cov
        run: cargo install cargo-llvm-cov && sudo apt install -y lcov
      - name: Install dependencies
        run: sudo apt-get install clang
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          echo "Installing Poetry $POETRY_VERSION"
          curl -sSL https://install.python-poetry.org | python3 - --version "$POETRY_VERSION"

          poetry --project tests check --lock
          poetry --project tests install --no-root
      - name: Run integration tests with coverage
        run: tools/integration-test-coverage.sh
      - name: Upload integration test coverage artifact
        uses: actions/upload-artifact@v5
        with:
          name: integration-test-coverage
          path: integration-test-coverage.lcov
          retention-days: 1

  merge-and-upload:
    needs: [unit-coverage, integration-coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # If scheduled by cron, run for dev branch, Otherwise specified branch (for workflow dispatch & push)
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref_name }}
          fetch-depth: 0 # Fetch all history for all tags and branches
      - name: Install lcov
        run: sudo apt install -y lcov
      - name: Download unit test coverage
        uses: actions/download-artifact@v6
        with:
          name: unit-test-coverage
      - name: Download integration test coverage
        uses: actions/download-artifact@v6
        with:
          name: integration-test-coverage
      - name: Merge coverage reports
        run: lcov -a unit-test-coverage.lcov -a integration-test-coverage.lcov -o merged.lcov
      - name: Upload coverage data to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: merged.lcov
          override_branch: ${{ github.event_name == 'schedule' && 'dev' || github.ref_name }}
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          fail_ci_if_error: false
      - name: Check coverage threshold
        run: |
          # Extract line coverage rate from lcov file
          TOTAL_LINES=$(grep -E '^LF:' merged.lcov | awk -F: '{sum+=$2} END {print sum}')
          COVERED_LINES=$(grep -E '^LH:' merged.lcov | awk -F: '{sum+=$2} END {print sum}')

          if [ "$TOTAL_LINES" -gt 0 ]; then
            COVERAGE=$(echo "scale=4; $COVERED_LINES / $TOTAL_LINES" | bc)
            COVERAGE_PERCENT=$(echo "scale=2; $COVERAGE * 100" | bc)
            THRESHOLD=70.0

            echo "Coverage: ${COVERAGE_PERCENT}%"
            echo "Threshold: ${THRESHOLD}%"

            # Compare coverage to threshold (using bc for float comparison)
            if (( $(echo "$COVERAGE_PERCENT < $THRESHOLD" | bc -l) )); then
              echo "❌ Coverage ${COVERAGE_PERCENT}% is below threshold ${THRESHOLD}%"
              exit 1
            else
              echo "✅ Coverage ${COVERAGE_PERCENT}% meets threshold ${THRESHOLD}%"
            fi
          else
            echo "⚠️ No coverage data found"
            exit 1
          fi
